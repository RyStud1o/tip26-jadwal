<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Dalam Pemeliharaan - TIP ULM 26'</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           DESAIN KHAS TIP ULM (DIAMBIL DARI STYLE.CSS)
           ========================================== */
        :root {
            --ulm-green: #0a5f38;
            --ulm-green-light: #128c55;
            --ulm-yellow: #fecb00;
            --bg-main: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow-md: 0 10px 20px rgba(0,0,0,0.08);
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Mencegah teks diblok/diseleksi */
            user-select: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Mencegah scroll */
        }

        /* Latar belakang dengan efek jaring transparan */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--ulm-green) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.05;
            z-index: -1;
        }

        .maintenance-card {
            background: var(--bg-card);
            width: 90%;
            max-width: 500px;
            padding: 50px 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            text-align: center;
            border-top: 6px solid var(--ulm-yellow);
            border-bottom: 6px solid var(--ulm-green);
            animation: slideUp 0.6s ease-out;
        }

        .pulse-logo {
            width: 100px;
            height: auto;
            margin-bottom: 25px;
            animation: pulse 2s infinite alternate;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--ulm-green);
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .badge-status {
            display: inline-block;
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        /* Animasi */
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.9; filter: drop-shadow(0 0 0 rgba(10, 95, 56, 0)); }
            100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 10px 15px rgba(10, 95, 56, 0.2)); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer Kustom */
        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <!-- Pastikan nama file gambar logo ULM sesuai dengan yang ada di foldermu -->
        <img src="ulm.webp" alt="Logo ULM" class="pulse-logo">
        
        <h1>Sistem Sedang Dalam Pemeliharaan</h1>
        <p>Mohon maaf atas ketidaknyamanannya. Portal Jadwal TIP ULM 26' saat ini sedang dalam proses pembaruan dan optimasi server. Developer kami sedang berupaya agar sistem segera kembali normal secepatnya.</p>
        
        <div class="badge-status">
            ⏳ Segera Kembali
        </div>
    </div>

    <div class="footer">
        &copy; 2026 - Developer System Maintenance (@vryy7_)
    </div>

    <script>
        /* ==========================================
           SISTEM ANTI-INSPECT CODE & KEAMANAN DASAR
           ========================================== */
        
        // 1. Mencegah Klik Kanan (Context Menu)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. Mencegah Shortcut Keyboard Inspect Element & View Source
        document.onkeydown = function(e) {
            // Mencegah F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Mencegah Ctrl+Shift+I (Inspect)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Mencegah Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Mencegah Ctrl+Shift+C (Element Inspector)
            if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
            // Mencegah Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Mencegah Ctrl+S (Save Page)
            if (e.ctrlKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
                e.preventDefault();
                return false;
            }
            // Mencegah Ctrl+P (Print Page)
            if (e.ctrlKey && (e.key === 'P' || e.key === 'p' || e.keyCode === 80)) {
                e.preventDefault();
                return false;
            }
        };

    </script>
</body>
</html>
